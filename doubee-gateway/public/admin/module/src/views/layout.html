<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <!-- 头部区域 -->
        <ul class="layui-nav layui-layout-left">
            <li class="layui-nav-item layadmin-flexible" lay-unselect>
                <a href="javascript:" layadmin-event="flexible" title="侧边伸缩">
                    <i class="layui-icon layui-icon-shrink-right" id="LAY_app_flexible"></i>
                </a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a href="javascript:;" layadmin-event="refresh" title="刷新">
                    <i class="layui-icon layui-icon-refresh-3"></i>
                </a>
            </li>
        </ul>
        <ul class="layui-nav layui-layout-right" lay-filter="layadmin-layout-right">
            <li class="layui-nav-item" lay-unselect>
                <script type="text/html" template lay-url="/admin/api/personal/account/getMeInfo" lay-type="get"
                        lay-done="layui.element.render('nav', 'layadmin-layout-right');">
                    <a href="javascript:">
                        <img src="/admin/images/avatar.png" style="height: 30px;border-radius: 50%;">
                        <cite>{{ d.data.email }}</cite>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a lay-href="system/me">基本资料</a></dd>
                        <hr>
                        <dd layadmin-event="logout" style="text-align: center;"><a>退出</a></dd>
                    </dl>
                </script>
            </li>

            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a href="javascript:"><i class="layui-icon layui-icon-more-vertical"></i></a>
            </li>
            <li class="layui-nav-item layui-show-xs-inline-block layui-hide-sm" lay-unselect>
                <a href="javascript:" layadmin-event="more"><i class="layui-icon layui-icon-more-vertical"></i></a>
            </li>
        </ul>
    </div>

    <!-- 侧边菜单 -->
    <div class="layui-side layui-side-menu">
        <div class="layui-side-scroll">
            <script type="text/html" template lay-url="/admin/api/personal/account/getMeInfo"
                    lay-done="layui.element.render('nav', 'layadmin-system-side-menu');" id="TPL_layout">

                <div class="layui-logo" lay-href="">
                    <span style="font-weight: 900;">{{ layui.setter.name }}</span>
                </div>

                <ul class="layui-nav layui-nav-tree" lay-shrink="all" id="LAY-system-side-menu"
                    lay-filter="layadmin-system-side-menu">
                    {{#
                    var path = layui.router().path
                    ,pathURL = layui.admin.correctRouter(path.join('/'))
                    ,dataName = layui.setter.response.dataName
                    ,menus = d[dataName].menus;

                    layui.each(menus, function(index, item){
                    var hasChildren = typeof item.children === 'object' && item.children.length > 0
                    ,classSelected = function(){

                    var match = path[0] == item.path || (index == 0 && !path[0])
                    || (item.path && pathURL == layui.admin.correctRouter(item.path)) || item.spread;
                    if(match){
                    return hasChildren ? 'layui-nav-itemed' : 'layui-this';
                    }
                    return '';
                    }
                    ,url = (item.path && typeof item.path === 'string') ? item.path : item.name;
                    }}
                    <li data-name="{{ item.name || '' }}" data-jump="{{ item.path || '' }}"
                        class="layui-nav-item {{ classSelected() }}">
                        <a href="javascript:;" {{ hasChildren ? '' : 'lay-href="'+ url +'"' }} lay-tips="{{ item.name
                        }}" lay-direction="2">
                        <i class="layui-icon {{ item.icon }}"></i>
                        <cite>{{ item.name }}</cite>
                        </a>
                        {{# if(hasChildren){ }}
                        <dl class="layui-nav-child">
                            {{# layui.each(item.children, function(index2, item2){
                            var hasChildren2 = typeof item2.children == 'object' && item2.children.length > 0
                            ,classSelected2 = function(){
                            var match = (path[0] == item.name && path[1] == item2.name)
                            || (item2.path && pathURL == layui.admin.correctRouter(item2.path)) || item2.spread;
                            if(match){
                            return hasChildren2 ? 'layui-nav-itemed' : 'layui-this';
                            }
                            return '';
                            }
                            ,url2 = (item2.path && typeof item2.path === 'string')
                            ? item2.path
                            : [item.name, item2.name].join('/');
                            }}
                            <dd data-name="{{ item2.name || '' }}" data-jump="{{ item2.path || '' }}"
                                {{ classSelected2() ? (
                            'class="'+ classSelected2() +'"') : '' }}>
                            <a href="javascript:;" {{ hasChildren2 ? '' : 'lay-href="'+ url2 +'"' }}>{{ item2.name
                            }}</a>
                            {{# if(hasChildren2){ }}
                            <dl class="layui-nav-child">
                                {{# layui.each(item2.children, function(index3, item3){
                                var match = (path[0] == item.name && path[1] == item2.name && path[2] == item3.name)
                                || (item3.path && pathURL == layui.admin.correctRouter(item3.jump))
                                ,url3 = (item3.path && typeof item3.path === 'string')
                                ? item3.path
                                : [item.name, item2.name, item3.name].join('/')
                                }}
                                <dd data-name="{{ item3.name || '' }}" data-jump="{{ item3.path || '' }}"
                                    {{ match ?
                                'class="layui-this"' : '' }}>
                                <a href="javascript:;" lay-href="{{ url3 }}" {{ item3.iframe ? 'lay-iframe="true"' : ''
                                }}>{{ item3.name }}</a>
                                </dd>
                                {{# }); }}
                            </dl>
                            {{# } }}
                            </dd>
                            {{# }); }}
                        </dl>
                        {{# } }}
                    </li>
                    {{# }); }}
                </ul>
            </script>
        </div>
    </div>


    <!-- 页面标签 -->
    <script type="text/html" template lay-done="layui.element.render('nav', 'layadmin-pagetabs-nav')">
        {{# if(layui.setter.pageTabs){ }}
        <div class="layadmin-pagetabs" id="LAY_app_tabs">
            <div class="layui-icon layadmin-tabs-control layui-icon-prev" layadmin-event="leftPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-next" layadmin-event="rightPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-down">
                <ul class="layui-nav layadmin-tabs-select" lay-filter="layadmin-pagetabs-nav">
                    <li class="layui-nav-item" lay-unselect>
                        <a href="javascript:;"></a>
                        <dl class="layui-nav-child layui-anim-fadein">
                            <dd layadmin-event="closeThisTabs"><a href="javascript:;">关闭当前标签页</a></dd>
                            <dd layadmin-event="closeOtherTabs"><a href="javascript:;">关闭其它标签页</a></dd>
                            <dd layadmin-event="closeAllTabs"><a href="javascript:;">关闭全部标签页</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
            <div class="layui-tab" lay-unauto lay-allowClose="true" lay-filter="layadmin-layout-tabs">
                <ul class="layui-tab-title" id="LAY_app_tabsheader">
                    <li lay-id="/"><i class="layui-icon layui-icon-home"></i></li>
                </ul>
            </div>
        </div>
        {{# } }}
    </script>


    <!-- 主体内容 -->
    <div class="layui-body" id="LAY_app_body">
        <div class="layadmin-tabsbody-item layui-show"></div>
    </div>

    <!-- 辅助元素，一般用于移动设备下遮罩 -->
    <div class="layadmin-body-shade" layadmin-event="shade"></div>

</div>


<script>
    layui.use(['hex', 'admin'], function () {
        $ = layui.jquery , admin = layui.admin;

        $('#system-cache-clear').click(function () {
            var token = localStorage.getItem("hexAdmin");
            localStorage.clear();
            localStorage.setItem("hexAdmin", token);
            window.location.reload();
        });

    });
</script>
