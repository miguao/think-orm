<view id="merchant-user-role">
    <title>角色管理</title>

    <div class="layui-card layadmin-header">
        <div class="layui-breadcrumb">
            <a lay-href="">商户管理</a>
            <a><cite>角色管理</cite></a>
        </div>
    </div>

    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    <li class="layui-this">所有角色</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <form class="query"></form>

                        <div style="margin-bottom: 10px;">
                            <button class="layui-btn layui-btn-primary layui-btn-sm create">
                                新增角色
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm del">
                                删除选中
                            </button>
                        </div>
                        <table id="merchant-user-role-table" lay-filter="merchant-user-role-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</view>

<script>
    layui.use(['hex'], function () {
        var $ = layui.$, hex = layui.hex, tableInstance, saveUrl = '/admin/api/merchant/role/saveRole';

        let modal = (values = {}) => {
            hex.popup(saveUrl, [
                {title: "角色名称", name: "name", type: "input", placeholder: "请输入角色名称"},
                {title: "状态", name: "status", type: "switch", text: "启用"}
            ], res => {
                tableInstance.instance.reload();
            }, values);
        }

        tableInstance = hex.renderTable('merchant-user-role-table', '/admin/api/merchant/role/getRoleList', '#merchant-user-role-table', [[
            {
                type: 'checkbox', fixed: 'left'
            }
            , {field: 'name', title: '角色名称', width: 160}
            , {field: 'creation_time', title: '创建时间'}
            , {
                field: 'status', title: '状态', dictType: "switch", dictText: "启用"
            },
            {
                title: '操作',
                action: [
                    {type: "button", icon: "layui-icon-survey", title: "修改", class: "layui-btn-normal edit"}
                ]
            }
        ]], res => {
            hex.setIdMap(res.data);
            $('#merchant-user-role .edit').click(function () {
                modal(hex.getMapItem(this));
            });
        }, saveUrl);

        $('#merchant-user-role .create').click(() => {
            modal();
        });

        $('#merchant-user-role .del').click(() => {
            var data = hex.listObjectToArray(tableInstance.table.checkStatus('merchant-user-role-table').data);
            hex.deleteBatchEntity('/admin/api/merchant/role/deleteRole', data, res => {
                tableInstance.instance.reload();
            });
        });
    });
</script>
