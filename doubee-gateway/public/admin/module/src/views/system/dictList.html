<view id="system-dictList">
    <title>数据列表</title>

    <div class="layui-card layadmin-header">
        <div class="layui-breadcrumb">
            <a lay-href="">系统管理</a>
            <a><cite>数据列表</cite></a>
        </div>
    </div>

    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    <li class="layui-this">全部列表</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <div style="margin-bottom: 10px;">
                            <button class="layui-btn layui-btn-primary layui-btn-sm create">
                                新增数据
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm del">
                                删除选中
                            </button>
                        </div>

                        <form class="query"></form>

                        <table id="system-dictList-table" lay-filter="system-dictList-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</view>


<script>
    layui.use(['hex'], function () {
        var $ = layui.$, hex = layui.hex, tableInstance, saveUrl = '/admin/api/dict/data/saveData',
            id = hex.get('systemDictId');

        let modal = (values = {}) => {
            hex.popup(saveUrl, [
                {title: "id", name: "dict_id", type: "hidden", default: id},
                {title: "数据名称", name: "name", type: "input", placeholder: "请输入数据名称"},
                {title: "数据值", name: "value", type: "input", placeholder: "请输入数据值"},
                {title: "状态", name: "status", type: "switch", text: "启用"},
                {title: "排序", name: "sort", type: "input", default: 0}
            ], res => {
                tableInstance.instance.reload();
            }, values);
        }

        tableInstance = hex.renderTable('system-dictList-table', '/admin/api/dict/data/getDataList?equal-dict_id=' + id, '#system-dictList-table', [[
            {
                type: 'checkbox', fixed: 'left'
            }
            , {
                field: 'name', title: '数据名称', edit: "text"
            }
            , {
                field: 'value', title: '数据值', edit: "text", width: 85
            }
            , {
                field: 'status', title: '状态', dictType: "switch", width: 110, dictText: "启用"
            }
            , {
                field: 'sort', title: '排序', edit: "text", width: 65
            }
            , {
                field: 'creation_time', title: '创建时间'
            }
        ]], res => {
            $('#system-dictList .edit').click(function () {
                modal(hex.getMapItem(this));
            });

            /*            let s = '{';
                        res.data.forEach(item => {
                            s += item.val + ":\"" + item.name + '",';
                        });

                        s += '}';
                        console.log(s);*/

        }, saveUrl, 335);


        $('#system-dictList .create').click(() => {
            modal();
        });

        $('#system-dictList .del').click(() => {
            var data = hex.listObjectToArray(tableInstance.table.checkStatus('system-dictList-table').data);
            hex.deleteBatchEntity('/admin/api/dict/data/deleteData', data, res => {
                tableInstance.instance.reload();
            })
        });

        hex.query('#system-dictList .query', tableInstance.instance, [
            {title: "数据名称", name: "search-name", type: "input", width: 151},
            {title: "数据值", name: "equal-val", type: "input", width: 151},
            {title: "状态", name: "equal-status", type: "select", width: 151, dict: "general_status"},
        ], true);
    });
</script>
