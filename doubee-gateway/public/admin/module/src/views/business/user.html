<view id="system-business-user">
    <title>用户管理</title>

    <div class="layui-card layadmin-header">
        <div class="layui-breadcrumb">
            <a lay-href="">运营管理</a>
            <a><cite>用户管理</cite></a>
        </div>
    </div>

    <div class="layui-fluid">
        <div class="layui-card">
            <div class="layui-card-header">会员数据统计
            </div>
            <div class="layui-card-body admin-dboOrder-bigData">

                <div class="layadmin-backlog">
                    <div>
                        <ul class="layui-row layui-col-space10">


                            <li class="layui-col-xs2">
                                <div class="layadmin-backlog-body admin-order-rate image-successRate">
                                    <h3>总用户</h3>
                                    <p><cite class="all_user_count" style="color: #07bd03;">...</cite>
                                    </p>
                                </div>
                            </li>

                            <li class="layui-col-xs2">
                                <div class="layadmin-backlog-body">
                                    <h3>商户</h3>
                                    <p><cite class="merchant_count" style="color: #07bd03;">...</cite>
                                    </p>
                                </div>
                            </li>


                            <li class="layui-col-xs2">
                                <div class="layadmin-backlog-body">
                                    <h3>码商</h3>
                                    <p><cite class="beneficiary_count" style="color: #ffb355;">...</cite>
                                    </p>
                                </div>
                            </li>


                            <li class="layui-col-xs2">
                                <div class="layadmin-backlog-body">
                                    <h3>自运营</h3>
                                    <p><cite class="employed_count" style="color: #578cbd;">...</cite>
                                    </p>
                                </div>
                            </li>

                            <li class="layui-col-xs2">
                                <div class="layadmin-backlog-body">
                                    <h3>代理商</h3>
                                    <p><cite class="agent_count" style="color: #bd5522;">...</cite>
                                    </p>
                                </div>
                            </li>


                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-card">
            <div class="layui-tab layui-tab-brief">
                <ul class="layui-tab-title">
                    <li class="layui-this">所有用户</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                        <form class="query"></form>
                        <div style="margin-bottom: 10px;">
                            <button class="layui-btn layui-btn-primary layui-btn-sm create">
                                新增用户
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm balance-add">
                                加/扣款
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm start">
                                启用选中(仅支付功能)
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm stop">
                                停用选中
                            </button>
                            <button class="layui-btn layui-btn-primary layui-btn-sm del">
                                删除选中
                            </button>
                        </div>
                        <table id="system-business-user-table" lay-filter="system-business-user-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</view>


<script>
    layui.use(['hex', 'admin'], function () {
        var $ = layui.$, admin = layui.admin, hex = layui.hex, tableInstance, saveUrl = '/admin/user/saveUser';
        // let config = hex.getConfigSync('appUpload');

        var appInterface = $('#system-business-user');

        var role = [
            '<span style="color: #06bd17">商户</span>',
            '<span style="color: red">码商</span>',
            '<span style="color:#ff89f0;">自运营</span>',
            '<span style="color:#ff9d3c;">代理商</span>',
        ];


        admin.req({
            url: "/admin/user/getUserStatistics",
            method: "POST",
            done: res => {
                appInterface.find(".merchant_count").html(res.data.merchant_count);
                appInterface.find(".beneficiary_count").html(res.data.beneficiary_count);
                appInterface.find(".employed_count").html(res.data.employed_count);
                appInterface.find(".all_user_count").html(res.data.all_user_count);
                appInterface.find(".agent_count").html(res.data.agent_count);
            }
        });


        let modal = (values = {}) => {
            hex.popup(saveUrl, [
                {title: "用户名", name: "user", type: "input", placeholder: "请输入登录用户名"},
                {title: "登录密码", name: "pass", type: "input", placeholder: "不修改请留空,至少需要6个字符串"},
                {title: "用户类型", name: "type", type: "select", placeholder: "请选择用户类型", dict: "business_user_type"},
                {title: "用户备注", name: "remark", type: "input", placeholder: "请输入用户备注"},
                {title: "谷歌口令", name: "token_login", type: "switch", text: "启用"},
                {title: "用户状态", name: "status", type: "switch", text: "启用", default: 1},
                {title: "支付功能", name: "pay_status", type: "switch", text: "启用", default: 1},
                {title: "单独控制", name: "control_rate", type: "switch", text: "启用"},
                {
                    title: "上级代理",
                    name: "agent_id",
                    type: "remoteSelect",
                    dict: "user,id,user",
                    placeholder: "搜索用户名.."
                }
            ], res => {
                tableInstance.instance.reload();
            }, values);
        }

        let balance = (values = {}) => {
            hex.popup('/admin/user/balance', [
                {
                    title: "操作方式",
                    name: "type",
                    type: "select",
                    placeholder: "请选择操作方式",
                    dict: "business_user_balance_type",
                    default: 0
                },
                {
                    title: "选择会员",
                    name: "userId",
                    type: "remoteSelect",
                    dict: "user,id,user",
                    placeholder: "搜索用户名.."
                },
                {title: "金额数量", name: "amount", type: "input", placeholder: "请输入金额数量"},
            ], res => {
                tableInstance.instance.reload();
            }, values);
        }

        appInterface.find('.balance-add').click(function () {
            let data = tableInstance.table.checkStatus('system-business-user-table').data;
            if (data.length > 1) {
                layer.msg("一次性只能选中一个用户");
                return;
            }
            let user = null;

            if (data[0] != null) {
                user = {name: data[0].user, value: data[0].id, selected: true};
            }
            if (user != null) {
                balance({userId: user});
                return;
            }

            balance();
        });


        tableInstance = hex.renderTable('system-business-user-table', '/admin/user/getUsers', '#system-business-user-table', [[
            {
                type: 'checkbox', fixed: 'left'
            }
            , {
                field: 'user', title: '用户名', templet: function (item) {

                    let balance = item.balance;

                    if (item.type == 1 || item.type == 2) {
                        balance = item.money;
                    }

                    return '<span style="font-size: 10px;color: red;">[' + item.id + '</span>] <span style="color: green;" class="detail" data-id="' + item.id + '">' + item.user + '</span>';
                }, width: 160
            }
            , {
                field: 'remark', title: '备注', width: 110, edit: "text"
            }
            , {
                field: 'type', title: '类型', width: 75, templet: function (item) {
                    return role[item.type];
                }
            }
            , {
                field: 'balance', title: '余额', width: 110, templet: function (item) {
                    let balance = item.balance;

                    if (item.type == 1 || item.type == 2) {
                        balance = item.money;
                    }

                    return '<b style="color: red;">' + balance + '</b>';
                }
            }, {
                field: 'today_order_success_count', title: '成功率', width: 90, templet: function (item) {
                    if (item.today_order_success_count == null || item.type == 3) {
                        return '-';
                    }
                    return (item.today_order_success_count == 0 ? 0 : ((item.today_order_success_count / item.today_order_count) * 100).toFixed(2)) + '%';
                }
            }
            /*          , {
                          field: 'balance', title: '余额', width: 95, templet: function (item) {
                              return '<b style="color: red;">' + item.balance + '</b>';
                          }
                      }
                      , {
                          field: 'money', title: '消费额', width: 95, templet: function (item) {
                              return '<a style="color: green;">' + item.money + '</a>';
                          }
                      }*/
            /*   , {
                   field: 'phone', title: '手机号', width: 120
               }*/
            , {
                field: 'order_today_amount', title: '今日收款', width: 110, templet: function (item) {
                    if (item.order_today_amount == null || item.type == 3) {
                        return '-';
                    }

                    return item.order_today_amount;
                }
            }
            , {
                field: 'order_yesterday_amount', title: '昨日收款', width: 110, templet: function (item) {
                    if (item.order_yesterday_amount == null || item.type == 3) {
                        return '-';
                    }

                    return item.order_yesterday_amount;
                }
            }
            , {
                field: 'order_all_amount', title: '总收款', width: 110, templet: function (item) {
                    if (item.order_all_amount == null || item.type == 3) {
                        return '-';
                    }
                    return item.order_all_amount;
                }
            }

            , {
                field: 'status', title: '状态', width: 110, dictType: "switch", dictText: "启用"
            }
            , {
                field: 'pay_status', title: '支付功能', width: 110, dictType: "switch", dictText: "开启"
            }
            , {
                field: 'control_rate', title: '单独控制', width: 110, templet: function (item) {
                    if (item.control_rate == 1) {
                        return '<span style="color: green;">启用</span> (<span class="controlRate" data-id="' + item.id + '" style="color: #0000FF;cursor: pointer;">配置</span>)';
                    }

                    return '<span style="color: red;">未启用</span>';
                }
            }
            , {
                field: 'token_login', title: '谷歌口令', width: 110, dictType: "switch", dictText: "开启"
            }
            , {
                field: 'agent_id', title: '上级代理', width: 110, templet: function (item) {
                    if (item.agent_id == null || item.agent == null) {
                        return '-';
                    }
                    return '<span style="color: green;">' + item.agent.user + '</span>'
                }
            }
            , {
                templet: function (item) {
                    let html = '';

                    if (item.check == 0) {
                        html += '<button class="layui-btn layui-btn-xs layui-btn-danger check" data-id="' + item.id + '"><i class="layui-icon layui-icon-ok"></i>审核</button> ';
                    }

                    html += '<button class="layui-btn layui-btn-xs layui-btn-normal edit" data-id="' + item.id + '"><i class="layui-icon layui-icon-survey"></i>修改</button>';

                    return html;
                }
            }
        ]], res => {
            let layerTipsIndex = 0;
            $('#system-business-user .edit').click(function () {
                let map = hex.getMapItem(this);
                delete map.pass;
                delete map.agent_id;
                if (map.agent != null) {
                    map.agent_id = {name: map.agent.user, value: map.agent.id, selected: true};
                }
                modal(map);
            });

            $('#system-business-user .detail').click(function () {
                var id = $(this).attr('data-id'), info = [], user = hex.getMapItem(this);

                info.push('<b>您正在查看</b> <b style="color: #ff9508;font-size: 16px;text-decoration:underline;">' + user.user + '</b> (' + role[user.type] + '):');
                info.push('<b style="color: #00ff6b;">商户ID：</b>' + user.id);
                info.push('<b style="color: #00ff6b;">商户密钥：</b>' + user.authorization);
                info.push('<b style="color: #00ff6b;">手机号：</b>' + user.phone);
                info.push('<b style="color: #00ff6b;">登录IP：</b>' + user.login_ip);
                info.push('<b style="color: #00ff6b;">登录时间：</b>' + user.login_date);
                info.push('<b style="color: #00ff6b;">注册IP：</b>' + user.create_ip);
                info.push('<b style="color: #00ff6b;">注册时间：</b>' + user.create_date);
                info.push('<b style="color: #00ff6b;">今日收款：</b>' + (user.type === 1 ? user.order_beneficiary_today_amount : user.order_today_amount));
                info.push('<b style="color: #00ff6b;">昨日收款：</b>' + (user.type === 1 ? user.order_beneficiary_yesterday_amount : user.order_yesterday_amount));
                info.push('<b style="color: #00ff6b;">总收款：</b>' + (user.type === 1 ? user.order_beneficiary_all_amount : user.order_all_amount));
                info.push('<b style="color: #00ff6b;">总提现：</b>' + user.withdraw_all_amount);
                if (user.type == 1) {
                    info.push('<b style="color: #00ff6b;">总下发：</b>' + user.withdraw_beneficiary_all_amount);
                }

                info.push('<b style="color: #00ff6b;">5分钟内总订单：</b>' + (user.type === 1 ? user.order_beneficiary_five_minutes_count : user.order_five_minutes_count));
                info.push('<b style="color: #00ff6b;">5分钟内成功单：</b>' + (user.type === 1 ? user.order_beneficiary_five_minutes_success_count : user.order_five_minutes_success_count));

                let order_beneficiary_five_minutes_success_rate = user.order_beneficiary_five_minutes_success_count / user.order_beneficiary_five_minutes_count;
                order_beneficiary_five_minutes_success_rate = isNaN(order_beneficiary_five_minutes_success_rate) ? '-' : (order_beneficiary_five_minutes_success_rate * 100) + '%';
                let order_five_minutes_success_rate = user.order_five_minutes_success_count / user.order_five_minutes_count;
                order_five_minutes_success_rate = isNaN(order_five_minutes_success_rate) ? '-' : (order_five_minutes_success_rate * 100) + '%';

                info.push('<b style="color: #00ff6b;">5分钟内成功率：</b>' + (user.type === 1 ? order_beneficiary_five_minutes_success_rate : order_five_minutes_success_rate));
                if (user.agent != null) {
                    info.push('<b style="color: #00ff6b;">上级代理：</b>' + user.agent.user + ' [' + user.agent.id + ']');
                }


                layer.open({
                    type: 1,
                    shade: [0.1, '#393D49'],
                    title: false,
                    shadeClose: true,
                    content: '<div style="float:left;width:330px;  overflow:hidden;  background:#000000; padding:10px;color: white;border-radius: 10px;">' + info.join('<br>') + '</div>',
                });

            });

            $('#system-business-user .controlRate').click(function () {
                let map = hex.getMapItem(this);
                hex.set('userId', map.id);
                hex.set('userType', map.type);
                hex.remoteViewOpen('module/src/views/business/rate.html', '费率控制', ['1230px', '590px']);
            });

            $('#system-business-user .check').click(function () {
                let id = hex.getObjectId(this);
                admin.req({
                    url: saveUrl,
                    method: "post",
                    data: {id: id, check: 1},
                    done: res => {
                        layer.msg('审核成功');
                        tableInstance.instance.reload();
                    }
                });
            });
        }, saveUrl, null, 10, [10, 15, 20, 30, 50, 60, 80, 100]);

        $('#system-business-user .create').click(() => {
            modal();
        });

        $('#system-business-user .del').click(() => {
            var data = hex.listObjectToArray(tableInstance.table.checkStatus('system-business-user-table').data);
            hex.deleteBatchEntity('/admin/user/delUser', data, res => {
                tableInstance.instance.reload();
            });
        });

        $('#system-business-user .start').click(() => {
            var data = hex.listObjectToArray(tableInstance.table.checkStatus('system-business-user-table').data);
            data.forEach(id => {
                admin.req({
                    url: saveUrl,
                    method: "post",
                    data: {id: id, pay_status: 1}
                });
            });
            tableInstance.instance.reload();
            layer.msg('启用完成..');
        });

        $('#system-business-user .stop').click(() => {
            var data = hex.listObjectToArray(tableInstance.table.checkStatus('system-business-user-table').data);
            data.forEach(id => {
                admin.req({
                    url: saveUrl,
                    method: "post",
                    data: {id: id, pay_status: 0}
                });
            });
            tableInstance.instance.reload();
            layer.msg('停用完成..');
        });

        hex.query('#system-business-user .query', tableInstance.instance, [
            {title: "用户名", name: "search-user", type: "input", width: 151},
            {title: "用户ID", name: "search-id", type: "input", width: 151},
            {title: "用户备注", name: "search-remark", type: "input", width: 151},
            {title: "用户状态", name: "equal-status", type: "select", width: 151, dict: "common_switch_status"},
            {title: "支付状态", name: "equal-pay_status", type: "select", width: 151, dict: "common_switch_status"},
            {title: "用户类型", name: "equal-type", type: "select", width: 151, dict: "business_user_type"},
            {
                title: "上级代理",
                name: "equal-agent_id",
                type: "select",
                dict: "user->type=3,id,user",
                cache: false,
                search: true,
                width: 125
            },
        ], true);
    });
</script>
